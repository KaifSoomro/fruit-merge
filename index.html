<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffb15c">
<title>Fruit Merge</title>
<link rel="icon" href="images/watermelon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="hud">
    <div class="card"><small>Score</small><b id="score" aria-live="polite">0</b></div>
    <div class="card"><small>Best</small><b id="best">0</b></div>
    <div class="card next"><small>Next</small><img id="next" alt="Next fruit" width="34" height="34"></div>
    <button id="restart" class="icon" type="button" aria-label="Restart game">🔄</button>
    <button id="mute" class="icon" type="button" aria-label="Toggle sound" aria-pressed="false">🔊</button>
  </header>
  <div class="stage">
    <canvas id="c" aria-label="Fruit Merge game board. Tap or press Space to drop a fruit."></canvas>
    <div id="over" role="dialog" aria-modal="true" aria-labelledby="ot" hidden>
      <div class="panel"><h2 id="ot">Game over</h2><p id="final"></p><button id="again" type="button">Play again</button></div>
    </div>
  </div>
  <p class="tip">Aim, then tap to drop. Match two of the same fruit to grow them.</p>
  <p class="tip">Made with ❤ by Kaif Soomro</p>
</main>
<script src="game.js"></script>
</body>
</html>
