<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Happy grape bunch</title>
  <desc id="desc">A simple cute vector bunch of purple grapes with soft gradients, a happy smiling face and fresh green leaves.</desc>
  <defs>
    <linearGradient id="grape" x1=".12" y1=".05" x2=".88" y2=".98">
      <stop offset="0" stop-color="#DDA7FF"/>
      <stop offset=".42" stop-color="#A85BE8"/>
      <stop offset="1" stop-color="#7435C0"/>
    </linearGradient>
    <linearGradient id="grapeLight" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#E8C1FF"/>
      <stop offset=".5" stop-color="#B875EF"/>
      <stop offset="1" stop-color="#8746D0"/>
    </linearGradient>
    <linearGradient id="leaf" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#B9EF70"/>
      <stop offset=".55" stop-color="#75C94D"/>
      <stop offset="1" stop-color="#3D9B45"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D0F58A"/>
      <stop offset="1" stop-color="#62B947"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8D957"/><stop offset="1" stop-color="#438E3B"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#54218B" flood-opacity=".16"/>
    </filter>
    <filter id="leafShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#276B35" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- leaves -->
  <g filter="url(#leafShadow)" stroke="#398B3D" stroke-width="5" stroke-linejoin="round">
    <path d="M249 157 C207 145 166 119 151 70 C198 65 240 83 263 122 C267 81 300 48 352 43 C359 91 330 133 276 158 C318 137 359 133 395 151 C365 184 321 191 270 171Z" fill="url(#leaf)"/>
    <path d="M252 154 C215 137 187 106 188 55 C226 62 254 87 266 125 C275 88 300 65 326 56 C323 104 303 139 269 163Z" fill="url(#leaf2)"/>
    <path d="M264 157 Q270 111 274 68" fill="none" stroke="url(#stem)" stroke-width="12" stroke-linecap="round"/>
    <path d="M264 157 Q218 116 166 83 M267 151 Q312 111 347 60 M270 158 Q331 151 381 158" fill="none" stroke="#E7FFB0" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>
    <path d="M204 111 Q222 111 238 137 M317 108 Q300 125 286 145" fill="none" stroke="#E7FFB0" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>
  </g>

  <!-- grape bunch -->
  <g filter="url(#shadow)" stroke="#7435B8" stroke-width="4.5">
    <circle cx="193" cy="190" r="49" fill="url(#grapeLight)"/>
    <circle cx="315" cy="190" r="49" fill="url(#grapeLight)"/>
    <circle cx="132" cy="277" r="49" fill="url(#grape)"/>
    <circle cx="256" cy="277" r="55" fill="url(#grapeLight)" stroke="#7435B8" stroke-width="5"/>
    <circle cx="380" cy="277" r="49" fill="url(#grape)"/>
    <circle cx="193" cy="368" r="49" fill="url(#grape)"/>
    <circle cx="319" cy="368" r="49" fill="url(#grapeLight)"/>
    <circle cx="256" cy="444" r="43" fill="url(#grape)"/>
  </g>

  <!-- simple graphic highlights -->
  <g fill="#FFFFFF" opacity=".42">
    <ellipse cx="176" cy="170" rx="12" ry="7" transform="rotate(-35 176 170)"/>
    <ellipse cx="298" cy="170" rx="12" ry="7" transform="rotate(-35 298 170)"/>
    <ellipse cx="116" cy="258" rx="11" ry="6.5" transform="rotate(-35 116 258)"/>
    <ellipse cx="238" cy="250" rx="13" ry="7.5" transform="rotate(-35 238 250)"/>
    <ellipse cx="364" cy="258" rx="11" ry="6.5" transform="rotate(-35 364 258)"/>
    <ellipse cx="176" cy="348" rx="11" ry="6.5" transform="rotate(-35 176 348)"/>
    <ellipse cx="302" cy="348" rx="12" ry="7" transform="rotate(-35 302 348)"/>
    <ellipse cx="242" cy="426" rx="10" ry="6" transform="rotate(-35 242 426)"/>
  </g>
  <g fill="#F8E9FF" opacity=".7">
    <circle cx="168" cy="165" r="3"/><circle cx="290" cy="165" r="3"/>
    <circle cx="108" cy="253" r="3"/><circle cx="230" cy="245" r="3.5"/>
    <circle cx="356" cy="253" r="3"/><circle cx="168" cy="343" r="3"/>
    <circle cx="294" cy="343" r="3"/><circle cx="235" cy="421" r="2.8"/>
  </g>

  <!-- happy face -->
  <g stroke="#49205F" stroke-linecap="round" stroke-linejoin="round">
    <path d="M235 276 Q239 267 245 276" fill="none" stroke-width="4.5"/>
    <path d="M267 276 Q273 267 278 276" fill="none" stroke-width="4.5"/>
    <path d="M244 294 Q256 306 268 294" fill="none" stroke-width="4.5"/>
  </g>
  <g fill="#FF8DB5">
    <ellipse cx="222" cy="291" rx="8" ry="5" opacity=".85"/>
    <ellipse cx="290" cy="291" rx="8" ry="5" opacity=".85"/>
  </g>
  <g fill="#FFD6E5" opacity=".9">
    <circle cx="220" cy="289" r="1.8"/><circle cx="288" cy="289" r="1.8"/>
  </g>
</svg>
